<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>More Flowers - BloomSense</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --pink-baby: #FFD1DC;
      --pink-soft: #FDE8ED;
      --pink-quote-bg: #FFF0F5;
      --pink-quote-border: #F7C1D3;
      --pink-blush: #F7A8C4;
      --pink-primary: #D24D80;
      --pink-deep: #A33B63;
      --pink-border: #F3C6D7;
      --bg-cream: #FAF6F0;
      --text-dark: #3A2E33;
      --text-muted: #5C4B52;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cormorant Garamond', serif;
      color: var(--text-dark);
      background-color: var(--bg-cream);
      line-height: 1.6;
      font-size: 1.15rem;
    }

    /* Header Navigation */
    .header-bar {
      width: 100%;
      background: var(--bg-cream);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 1.2rem 0;
    }

    .navbar {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
    }

    .logo-placeholder {
      width: 150px;
      height: 42px;
      border: 1px dashed var(--pink-blush);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--pink-deep);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      background-color: transparent;
    }

    .nav-right-group {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2rem;
      align-items: center;
    }

    .nav-links a {
      font-family: 'Plus Jakarta Sans', sans-serif;
      text-decoration: none;
      color: var(--text-dark);
      font-size: 1rem;
      font-weight: 500;
      transition: color 0.2s ease;
      position: relative;
      padding-bottom: 4px;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--pink-primary);
    }

    .cart-btn-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--pink-soft);
      border: 1px solid var(--pink-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--pink-primary);
      text-decoration: none;
      font-size: 0.95rem;
      transition: transform 0.2s;
    }

    .cart-btn-circle:hover {
      transform: scale(1.05);
    }

    /* Container */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem 1.5rem;
    }

    /* Section Header */
    .section-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.2rem;
      font-weight: 600;
      color: var(--pink-primary);
      margin-bottom: 0.3rem;
    }

    .section-header p {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    /* Category Grid Layout (3x3) */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }

    /* Category Card */
    .category-card {
      background-color: #FFFFFF;
      border: 1px solid var(--pink-border);
      border-radius: 20px;
      padding: 1.2rem;
      text-align: center;
      text-decoration: none;
      color: var(--text-dark);
      box-shadow: 0 6px 20px rgba(210, 77, 128, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .category-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(210, 77, 128, 0.12);
      border-color: var(--pink-primary);
    }

    /* Card Image Container */
    .card-img-container {
      width: 100%;
      height: 200px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 1.2rem;
      border: 1px solid var(--pink-border);
      background-color: var(--pink-soft);
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .category-card:hover .card-img-container img {
      transform: scale(1.04);
    }

    .category-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-dark);
      transition: color 0.2s;
    }

    .category-card:hover .category-name {
      color: var(--pink-primary);
    }

    /* Back Button Card */
    .explore-card {
      background: linear-gradient(135deg, var(--pink-soft) 0%, #FFFFFF 100%);
      border: 2px dashed var(--pink-primary);
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .explore-card:hover {
      background: var(--pink-soft);
      border-style: solid;
    }

    .explore-icon-wrapper {
      width: 70px;
      height: 70px;
      background-color: #FFFFFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      color: var(--pink-primary);
      font-size: 1.8rem;
      box-shadow: 0 4px 12px rgba(210, 77, 128, 0.15);
      transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease;
    }

    .explore-card:hover .explore-icon-wrapper {
      transform: scale(1.1);
      background-color: var(--pink-primary);
      color: #FFFFFF;
    }

    .explore-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--pink-deep);
      margin-bottom: 0.4rem;
    }

    .explore-btn-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--pink-primary);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .explore-card:hover .explore-btn-text i {
      transform: translateX(-4px);
    }

    .explore-btn-text i {
      transition: transform 0.2s ease;
    }

    /* Responsive Adjustments */
    @media (max-width: 900px) {
      .categories-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
      }
      .navbar {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
      .nav-right-group {
        flex-direction: column;
        gap: 0.8rem;
      }
    }

    @media (max-width: 550px) {
      .categories-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Header Navigation -->
  <header class="header-bar">
    <nav class="navbar">
      <a href="categories.html" class="logo-container">
        <div class="logo-placeholder">Logo Space</div>
      </a>

      <div class="nav-right-group">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="birthflower.html">Birth Flower</a></li>
          <li><a href="about.html">About BloomSense</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <a href="#" class="cart-btn-circle" aria-label="Shopping Cart">
          <i class="fa-solid fa-cart-shopping"></i>
        </a>
      </div>
    </nav>
  </header>

  <main class="container">

    <!-- Section Header -->
    <section class="section-header">
      <h1>Flower Section</h1>
      <p>Choose a category</p>
    </section>

    <!-- Flower Categories Grid (3x3) -->
    <section class="categories-grid">

      <!-- Flower 1: Aster -->
      <a href="flower-listing.html" class="category-card">
        <div class="card-img-container">
          <img src="aster.jpeg" alt="Aster">
        </div>
        <span class="category-name">Aster</span>
      </a>

      <!-- Flower 2: Chrysanthemum -->
      <a href="flower-listing.html" class="category-card">
        <div class="card-img-container">
          <img src="chrysanthemum.jpeg" alt="Chrysanthemum">
        </div>
        <span class="category-name">Chrysanthemum</span>
      </a>

      <!-- Flower 3: Lily of the Valley -->
      <a href="flower-listing.html" class="category-card">
        <div class="card-img-container">
          <img src="lily-of-valley.jpeg" alt="Lily of the Valley">
        </div>
        <span class="category-name">Lily of the Valley</span>
      </a>

      <!-- Flower 4: Poppy -->
      <a href="flower-listing.html" class="category-card">
        <div class="card-img-container">
          <img src="poppy.jpeg" alt="Poppy">
        </div>
        <span class="category-name">Poppy</span>
      </a>

      <!-- Flower 5: Marigold -->
      <a href="flower-listing.html" class="category-card">
        <div class="card-img-container">
          <img src="marigold.jpeg" alt="Marigold">
        </div>
        <span class="category-name">Marigold</span>
      </a>

      <!-- Flower 6: Narcissus -->
      <a href="flower-listing.html" class="category-card">
        <div class="card-img-container">
          <img src="narcissus.jpeg" alt="Narcissus">
        </div>
        <span class="category-name">Narcissus</span>
      </a>

      <!-- Flower 7: Violet -->
      <a href="flower-listing.html" class="category-card">
        <div class="card-img-container">
          <img src="violet.jpeg" alt="Violet">
        </div>
        <span class="category-name">Violet</span>
      </a>

      <!-- Flower 8: Water Lily -->
      <a href="flower-listing.html" class="category-card">
        <div class="card-img-container">
          <img src="water-lily.jpeg" alt="Water Lily">
        </div>
        <span class="category-name">Water Lily</span>
      </a>

      <!-- Interconnected Navigation Back to Page 1 -->
      <a href="categories.html" class="category-card explore-card">
        <div class="explore-icon-wrapper">
          <i class="fa-solid fa-house"></i>
        </div>
        <span class="explore-title">Main Section</span>
        <span class="explore-btn-text">
          <i class="fa-solid fa-arrow-left"></i> Back to Home
        </span>
      </a>

    </section>

  </main>

</body>
</html>
