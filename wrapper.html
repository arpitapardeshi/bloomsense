<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloomSense - Explore Flowers</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background: #fbf7f2;
            color: #342426;
            font-family: 'Montserrat', sans-serif;
        }

        .wrapper-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        #flowerPage {
            display: block;
            width: 100%;
            height: 900px;
            border: none;
            margin: 0;
            padding: 0;
            background: #fbf7f2;
        }

        /* Bottom navigation */
        .flower-wrapper {
            display: none;
            margin: 0;
            padding: 8px 30px 30px;
        }

        .wrapper-line {
            width: 100%;
            height: 1px;
            background: #e6d8cf;
            margin-bottom: 12px;
        }

        .wrapper-footer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: #f5eee7;
            border: 1px solid #eaded5;
            border-radius: 18px;
            padding: 20px;
        }

        .wrapper-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            text-decoration: none;
            color: #342426;
            border-radius: 14px;
            transition: background 0.3s ease,
                        transform 0.3s ease;
            min-width: 0;
        }

        .wrapper-link:hover {
            background: #eee1d7;
            transform: translateY(-2px);
        }

        .wrapper-icon {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            background: #ead4d2;
            color: #8c5156;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .wrapper-text {
            flex: 1;
        }

        .wrapper-text h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 25px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .wrapper-text p {
            font-size: 12px;
            line-height: 1.6;
            color: #806d6c;
        }

        .wrapper-arrow {
            color: #8c5156;
            font-size: 16px;
        }

        @media (max-width: 800px) {
            .flower-wrapper {
                padding: 8px 15px 25px;
            }

            .wrapper-footer {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 12px;
            }

            .wrapper-link {
                padding: 15px 10px;
            }

            .wrapper-text h3 {
                font-size: 23px;
            }

            .wrapper-text p {
                font-size: 11px;
            }
        }

        @media (max-width: 400px) {
            .wrapper-icon {
                width: 44px;
                height: 44px;
                min-width: 44px;
                font-size: 18px;
            }

            .wrapper-text h3 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper-container">

        <iframe
            id="flowerPage"
            src="Search.html"
            title="BloomSense Flower Selection"
            scrolling="no">
        </iframe>

        <!-- Bottom navigation -->
        <div class="flower-wrapper" id="flowerWrapper">

            <div class="wrapper-line"></div>

            <div class="wrapper-footer">

                <a href="search.html"
                   class="wrapper-link"
                   id="occasionLink">

                    <i class="fa-solid fa-arrow-left wrapper-arrow"></i>

                    <div class="wrapper-icon">
                        <i class="fa-regular fa-calendar"></i>
                    </div>

                    <div class="wrapper-text">
                        <h3>Shop by Occasion</h3>
                        <p>Explore flowers for every moment</p>
                    </div>

                </a>

                <a href="categories.html"
                   class="wrapper-link"
                   id="categoriesLink">

                    <div class="wrapper-icon">
                        <i class="fa-solid fa-seedling"></i>
                    </div>

                    <div class="wrapper-text">
                        <h3>Explore Flowers</h3>
                        <p>Discover your perfect flower</p>
                    </div>

                    <i class="fa-solid fa-arrow-right wrapper-arrow"></i>

                </a>

            </div>
        </div>

    </div>

    <script>
        const flowerPage = document.getElementById("flowerPage");
        const flowerWrapper = document.getElementById("flowerWrapper");

        const measurementHeight = 900;
        let lastPageUrl = "";

        // Measure the page from a consistent baseline.
        // Do not allow the previous iframe height to cause
        // the next measurement to grow indefinitely.
        function resizeFlowerPage() {
            try {
                const pageDocument = flowerPage.contentDocument;

                if (!pageDocument || !pageDocument.body) {
                    return;
                }

                const pageBody = pageDocument.body;
                const pageHtml = pageDocument.documentElement;

                // Temporarily return to the same measurement height.
                flowerPage.style.height = measurementHeight + "px";

                // Force layout calculation at the baseline height.
                pageHtml.getBoundingClientRect();

                let contentHeight = Math.max(
                    pageBody.scrollHeight,
                    pageBody.offsetHeight,
                    pageHtml.scrollHeight,
                    pageHtml.offsetHeight
                );

                // Also check the bottoms of content elements.
                // This helps with pages containing positioned elements.
                const elements = pageBody.querySelectorAll("*");

                elements.forEach(function(element) {
                    const style =
                        pageDocument.defaultView.getComputedStyle(element);

                    // Ignore fixed elements that are not part
                    // of the normal page content.
                    if (style.position === "fixed") {
                        return;
                    }

                    const rect = element.getBoundingClientRect();

                    const elementBottom =
                        rect.bottom + pageDocument.defaultView.scrollY;

                    if (Number.isFinite(elementBottom)) {
                        contentHeight = Math.max(
                            contentHeight,
                            elementBottom
                        );
                    }
                });

                // Add a small allowance for bottom padding and borders.
                const newHeight = Math.ceil(
                    Math.max(measurementHeight, contentHeight + 10)
                );

                // Only apply a height change when necessary.
                // Avoid unnecessary repeated layout changes on scroll.
                if (
                    Math.abs(
                        flowerPage.getBoundingClientRect().height -
                        newHeight
                    ) > 2
                ) {
                    flowerPage.style.height = newHeight + "px";
                }

            } catch (error) {
                // Keep the currently loaded page if measurement fails.
            }
        }

        function updateWrapperVisibility() {
            try {
                const pageWindow = flowerPage.contentWindow;
                const currentPath =
                    pageWindow.location.pathname.toLowerCase();

                const currentPage =
                    currentPath.substring(
                        currentPath.lastIndexOf("/") + 1
                    );

                // Show navigation only on the initial Search screen.
                if (currentPage === "search.html") {
                    const homePage =
                        pageWindow.document.getElementById("homePage");

                    flowerWrapper.style.display =
                        homePage &&
                        homePage.classList.contains("active")
                            ? "block"
                            : "none";

                    return;
                }

                // Show navigation on Categories.html.
                if (currentPage === "categories.html") {
                    flowerWrapper.style.display = "block";
                    return;
                }

                // Hide navigation on all other pages.
                flowerWrapper.style.display = "none";

            } catch (error) {
                flowerWrapper.style.display = "none";
            }
        }

        // Handle a new page loaded inside the iframe.
        flowerPage.addEventListener("load", function() {
            lastPageUrl = flowerPage.contentWindow.location.href;

            resizeFlowerPage();
            updateWrapperVisibility();

            // Measure again after the browser has applied page styles.
            requestAnimationFrame(function() {
                resizeFlowerPage();
                updateWrapperVisibility();
            });

            // Check once more after images and other resources settle.
            setTimeout(function() {
                resizeFlowerPage();
                updateWrapperVisibility();
            }, 300);
        });

        // Recheck navigation visibility and page size.
        // The iframe is measured from the same baseline each time.
        setInterval(function() {
            try {
                const currentUrl = flowerPage.contentWindow.location.href;

                if (currentUrl !== lastPageUrl) {
                    lastPageUrl = currentUrl;
                    resizeFlowerPage();
                } else {
                    resizeFlowerPage();
                }

                updateWrapperVisibility();

            } catch (error) {
                // Ignore temporary navigation or loading errors.
            }
        }, 1000);

        // Shop by Occasion.
        document.getElementById("occasionLink")
            .addEventListener("click", function(event) {
                event.preventDefault();

                flowerPage.src = "search.html";

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });

        // Explore Flowers.
        document.getElementById("categoriesLink")
            .addEventListener("click", function(event) {
                event.preventDefault();

                flowerPage.src = "categories.html";

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
    </script>

</body>
</html>
