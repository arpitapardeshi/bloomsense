<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BloomSense</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #fbf7f2;
    overflow-x: hidden;
}

#flowerPage {
    display: block;
    width: 100%;
    height: 900px;
    border: none;
    background: #fbf7f2;
}

.flower-wrapper {
    display: none;
    width: 100%;
    padding: 14px 12px;
    background: #fbf7f2;
    text-align: center;
}

.flower-wrapper a {
    display: inline-block;
    margin: 5px;
    padding: 10px 20px;
    border: 1px solid #d8c4b8;
    border-radius: 25px;
    color: #503b32;
    background: #fffaf5;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 14px;
}

.flower-wrapper a:hover {
    background: #efe2d8;
}

@media (max-width: 800px) {
    .flower-wrapper {
        padding: 10px 8px;
    }

    .flower-wrapper a {
        padding: 9px 15px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<iframe
    id="flowerPage"
    src="search.html"
    title="BloomSense Flower Store">
</iframe>

<div class="flower-wrapper" id="wrapperNavigation">
    <a href="search.html" id="searchLink">Search Flowers</a>
    <a href="categories.html" id="categoriesLink">Categories</a>
</div>

<script>
const flowerPage = document.getElementById("flowerPage");
const wrapperNavigation = document.getElementById("wrapperNavigation");

let resizeObserver = null;
let mutationObserver = null;
let resizeTimer = null;

function resizeFlowerPage() {
    try {
        const doc = flowerPage.contentDocument;

        if (!doc || !doc.documentElement || !doc.body) {
            return;
        }

        const body = doc.body;
        const root = doc.documentElement;

        // Measure the complete content of the currently visible page.
        const contentHeight = Math.max(
            body.scrollHeight,
            body.offsetHeight,
            root.scrollHeight,
            root.offsetHeight,
            root.clientHeight
        );

        if (contentHeight > 0) {
            flowerPage.style.height = contentHeight + "px";
        }
    } catch (error) {
        // Automatic resizing requires Search.html to be on the same origin.
        console.warn("Could not resize the BloomSense iframe.", error);
    }
}

function updateWrapperVisibility() {
    try {
        const doc = flowerPage.contentDocument;

        if (!doc || !doc.location) {
            wrapperNavigation.style.display = "none";
            return;
        }

        const pageName = doc.location.pathname
            .split("/")
            .pop()
            .toLowerCase();

        if (pageName === "search.html") {
            const homePage = doc.getElementById("homePage");

            wrapperNavigation.style.display =
                homePage && homePage.classList.contains("active")
                    ? "block"
                    : "none";

        } else if (pageName === "categories.html") {
            wrapperNavigation.style.display = "block";
        } else {
            wrapperNavigation.style.display = "none";
        }
    } catch (error) {
        wrapperNavigation.style.display = "none";
    }
}

function observeFlowerPage() {
    // Disconnect observers from the previously loaded document.
    if (resizeObserver) {
        resizeObserver.disconnect();
        resizeObserver = null;
    }

    if (mutationObserver) {
        mutationObserver.disconnect();
        mutationObserver = null;
    }

    try {
        const doc = flowerPage.contentDocument;

        if (!doc || !doc.body || !doc.documentElement) {
            return;
        }

        // Resize when the document or its contents change size.
        if ("ResizeObserver" in window) {
            resizeObserver = new ResizeObserver(function () {
                resizeFlowerPage();
            });

            resizeObserver.observe(doc.documentElement);
            resizeObserver.observe(doc.body);
        }

        // Detect navigation between the internal Search.html sections.
        if ("MutationObserver" in window) {
            mutationObserver = new MutationObserver(function () {
                resizeFlowerPage();
                updateWrapperVisibility();
            });

            mutationObserver.observe(doc.body, {
                attributes: true,
                childList: true,
                subtree: true,
                characterData: true
            });
        }

        resizeFlowerPage();
        updateWrapperVisibility();

        // Allow images and dynamically rendered content to settle.
        requestAnimationFrame(resizeFlowerPage);
        setTimeout(resizeFlowerPage, 150);
        setTimeout(resizeFlowerPage, 500);
        setTimeout(resizeFlowerPage, 1000);

    } catch (error) {
        console.warn("Could not observe the BloomSense iframe.", error);
    }
}

flowerPage.addEventListener("load", function () {
    observeFlowerPage();
});

// Keep navigation and height synchronized during internal page changes.
resizeTimer = setInterval(function () {
    resizeFlowerPage();
    updateWrapperVisibility();
}, 500);

window.addEventListener("resize", function () {
    resizeFlowerPage();
});

// Bottom navigation
document.getElementById("searchLink").addEventListener("click", function (e) {
    e.preventDefault();

    if (!flowerPage.src.toLowerCase().includes("search.html")) {
        flowerPage.src = "search.html";
    } else {
        try {
            const doc = flowerPage.contentDocument;
            const homePage = doc.getElementById("homePage");

            if (homePage) {
                doc.querySelectorAll(".page").forEach(function (page) {
                    page.classList.remove("active");
                });

                homePage.classList.add("active");

                if (typeof flowerPage.contentWindow.home === "function") {
                    flowerPage.contentWindow.home();
                }
            }
        } catch (error) {
            flowerPage.src = "search.html";
        }
    }

    window.scrollTo({ top: 0, behavior: "auto" });
});

document.getElementById("categoriesLink").addEventListener("click", function (e) {
    e.preventDefault();

    flowerPage.src = "Categories.html";
    window.scrollTo({ top: 0, behavior: "auto" });
});

// Initial setup
window.addEventListener("DOMContentLoaded", function () {
    resizeFlowerPage();
    updateWrapperVisibility();
});
</script>

</body>
</html>
