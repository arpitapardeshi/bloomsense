<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloomSense - Explore Flowers</title>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            background: #fbf7f2;
            color: #342426;
            font-family: 'Montserrat', sans-serif;
        }

        .wrapper-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        #flowerPage {
            display: block;
            width: 100%;
            height: 900px;
            border: none;
            margin: 0;
            padding: 0;
            background: #fbf7f2;
        }

        /* Bottom navigation */
        .flower-wrapper {
            display: none;
            margin: 0;
            padding: 8px 30px 30px;
        }

        .wrapper-line {
            width: 100%;
            height: 1px;
            background: #e6d8cf;
            margin-bottom: 12px;
        }

        .wrapper-footer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: #f5eee7;
            border: 1px solid #eaded5;
            border-radius: 18px;
            padding: 20px;
        }

        .wrapper-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            text-decoration: none;
            color: #342426;
            border-radius: 14px;
            transition: background 0.3s ease,
                        transform 0.3s ease;
            min-width: 0;
        }

        .wrapper-link:hover {
            background: #eee1d7;
            transform: translateY(-2px);
        }

        .wrapper-icon {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            background: #ead4d2;
            color: #8c5156;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .wrapper-text {
            flex: 1;
        }

        .wrapper-text h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 25px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .wrapper-text p {
            font-size: 12px;
            line-height: 1.6;
            color: #806d6c;
        }

        .wrapper-arrow {
            color: #8c5156;
            font-size: 16px;
        }

        @media (max-width: 800px) {
            .flower-wrapper {
                padding: 8px 15px 25px;
            }

            .wrapper-footer {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 12px;
            }

            .wrapper-link {
                padding: 15px 10px;
            }

            .wrapper-text h3 {
                font-size: 23px;
            }

            .wrapper-text p {
                font-size: 11px;
            }
        }

        @media (max-width: 400px) {
            .wrapper-icon {
                width: 44px;
                height: 44px;
                min-width: 44px;
                font-size: 18px;
            }

            .wrapper-text h3 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="wrapper-container">

        <iframe
            id="flowerPage"
            src="search.html"
            title="BloomSense Flower Selection"
            scrolling="no">
        </iframe>

        <!-- Bottom navigation -->
        <div class="flower-wrapper" id="flowerWrapper">

            <div class="wrapper-line"></div>

            <div class="wrapper-footer">

                <a href="search.html"
                   class="wrapper-link"
                   id="occasionLink">

                    <i class="fa-solid fa-arrow-left wrapper-arrow"></i>

                    <div class="wrapper-icon">
                        <i class="fa-regular fa-calendar"></i>
                    </div>

                    <div class="wrapper-text">
                        <h3>Shop by Occasion</h3>
                        <p>Explore flowers for every moment</p>
                    </div>

                </a>

                <a href="categories.html"
                   class="wrapper-link"
                   id="categoriesLink">

                    <div class="wrapper-icon">
                        <i class="fa-solid fa-seedling"></i>
                    </div>

                    <div class="wrapper-text">
                        <h3>Explore Flowers</h3>
                        <p>Discover your perfect flower</p>
                    </div>

                    <i class="fa-solid fa-arrow-right wrapper-arrow"></i>

                </a>

            </div>
        </div>

    </div>

    <script>
        const flowerPage = document.getElementById("flowerPage");
        const flowerWrapper = document.getElementById("flowerWrapper");

        let resizeFrame = null;
        let mutationObserver = null;
        let resizeObserver = null;
        let imageLoadHandler = null;
        let lastPageUrl = "";
        let lastWrapperState = "";

        /*
         * Adjust viewport-dependent heights inside search.html.
         * This prevents the iframe height from affecting its own
         * content height through 100vh and min-height rules.
         */
        function prepareEmbeddedPage() {
            try {
                const doc = flowerPage.contentDocument;

                if (!doc || !doc.head || !doc.body) return;

                if (!doc.getElementById("bloomsense-iframe-fixes")) {
                    const style = doc.createElement("style");
                    style.id = "bloomsense-iframe-fixes";

                    style.textContent = `
                        html,
                        body {
                            height: auto !important;
                            min-height: 0 !important;
                        }

                        .page {
                            min-height: 0 !important;
                        }

                        #confirmation {
                            min-height: 0 !important;
                        }

                        .detail-image {
                            height: 650px !important;
                            min-height: 650px !important;
                            max-height: 760px !important;
                        }

                        @media (max-width: 800px) {
                            .detail-image {
                                height: 350px !important;
                                min-height: 350px !important;
                                max-height: 350px !important;
                            }
                        }
                    `;

                    doc.head.appendChild(style);
                }
            } catch (error) {
                // Keep the existing page if styling cannot be injected.
            }
        }

        /*
         * Measure the currently visible content.
         * Hidden sections are not counted, so changing pages
         * can make the iframe both taller and shorter.
         */
        function measureContentHeight() {
            try {
                const doc = flowerPage.contentDocument;

                if (!doc || !doc.body || !doc.documentElement) {
                    return null;
                }

                const body = doc.body;
                const html = doc.documentElement;

                let bottom = 0;

                const elements = body.querySelectorAll("*");

                elements.forEach(function(element) {
                    const style = doc.defaultView.getComputedStyle(element);

                    if (
                        style.display === "none" ||
                        style.visibility === "hidden" ||
                        style.position === "fixed"
                    ) {
                        return;
                    }

                    const rect = element.getBoundingClientRect();

                    if (rect.width === 0 && rect.height === 0) {
                        return;
                    }

                    const elementBottom =
                        rect.bottom + doc.defaultView.scrollY;

                    if (Number.isFinite(elementBottom)) {
                        bottom = Math.max(bottom, elementBottom);
                    }
                });

                const bodyStyle = doc.defaultView.getComputedStyle(body);

                const bodyPaddingBottom =
                    parseFloat(bodyStyle.paddingBottom) || 0;

                const measuredHeight = Math.ceil(Math.max(
                    bottom + bodyPaddingBottom,
                    body.scrollHeight,
                    body.offsetHeight,
                    html.scrollHeight,
                    html.offsetHeight
                ));

                return Math.max(200, measuredHeight + 8);

            } catch (error) {
                return null;
            }
        }

        function resizeFlowerPage() {
            const newHeight = measureContentHeight();

            if (newHeight === null) return;

            const currentHeight =
                flowerPage.getBoundingClientRect().height;

            if (Math.abs(currentHeight - newHeight) > 3) {
                flowerPage.style.height = newHeight + "px";
            }
        }

        /*
         * Coalesce repeated changes into one measurement.
         */
        function scheduleResize() {
            if (resizeFrame !== null) return;

            resizeFrame = requestAnimationFrame(function() {
                resizeFrame = null;

                prepareEmbeddedPage();
                resizeFlowerPage();
                updateWrapperVisibility();
            });
        }

        /*
         * Footer visibility depends on the actual page currently
         * displayed inside the iframe.
         */
        function updateWrapperVisibility() {
            try {
                const pageWindow = flowerPage.contentWindow;
                const doc = flowerPage.contentDocument;

                if (!pageWindow || !doc) return;

                const currentPath =
                    pageWindow.location.pathname.toLowerCase();

                const currentPage = currentPath.substring(
                    currentPath.lastIndexOf("/") + 1
                );

                let shouldShow = false;

                if (currentPage === "search.html") {
                    const homePage = doc.getElementById("homePage");

                    shouldShow = !!(
                        homePage &&
                        homePage.classList.contains("active")
                    );
                } else if (currentPage === "categories.html") {
                    shouldShow = true;
                }

                const newState = shouldShow ? "visible" : "hidden";

                if (newState !== lastWrapperState) {
                    flowerWrapper.style.display =
                        shouldShow ? "block" : "none";

                    lastWrapperState = newState;
                }

            } catch (error) {
                flowerWrapper.style.display = "none";
                lastWrapperState = "hidden";
            }
        }

        /*
         * Observe page changes, including internal navigation such
         * as Home, flower details, cart, checkout and success pages.
         */
        function observeEmbeddedPage() {
            try {
                const doc = flowerPage.contentDocument;

                if (!doc || !doc.body) return;

                if (mutationObserver) {
                    mutationObserver.disconnect();
                }

                if (resizeObserver) {
                    resizeObserver.disconnect();
                }

                if (imageLoadHandler) {
                    doc.removeEventListener(
                        "load",
                        imageLoadHandler,
                        true
                    );
                }

                prepareEmbeddedPage();

                mutationObserver = new MutationObserver(function() {
                    scheduleResize();
                });

                mutationObserver.observe(doc.body, {
                    subtree: true,
                    childList: true,
                    attributes: true,
                    attributeFilter: ["class", "style", "hidden"],
                    characterData: true
                });

                resizeObserver = new ResizeObserver(function() {
                    scheduleResize();
                });

                resizeObserver.observe(doc.body);

                if (doc.documentElement) {
                    resizeObserver.observe(doc.documentElement);
                }

                imageLoadHandler = function(event) {
                    if (event.target && event.target.tagName === "IMG") {
                        scheduleResize();
                    }
                };

                doc.addEventListener("load", imageLoadHandler, true);

                updateWrapperVisibility();
                scheduleResize();

                // Recheck after fonts and images finish rendering.
                setTimeout(scheduleResize, 250);
                setTimeout(scheduleResize, 700);
                setTimeout(scheduleResize, 1200);

            } catch (error) {
                // Keep the current iframe height if observation fails.
            }
        }

        /*
         * Handle full iframe page loads.
         */
        flowerPage.addEventListener("load", function() {
            try {
                lastPageUrl = flowerPage.contentWindow.location.href;
            } catch (error) {
                lastPageUrl = "";
            }

            observeEmbeddedPage();
        });

        /*
         * Detect URL changes without forcing the iframe to a
         * fixed height or resetting the user's scroll position.
         */
        setInterval(function() {
            try {
                const currentUrl = flowerPage.contentWindow.location.href;

                if (currentUrl !== lastPageUrl) {
                    lastPageUrl = currentUrl;
                    observeEmbeddedPage();
                } else {
                    updateWrapperVisibility();
                }
            } catch (error) {
                // Ignore temporary navigation errors.
            }
        }, 500);

        /*
         * Shop by Occasion: load the search page at the top.
         */
        document.getElementById("occasionLink")
            .addEventListener("click", function(event) {
                event.preventDefault();

                flowerPage.src = "search.html";

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });

        /*
         * Explore Flowers: load the categories page at the top.
         */
        document.getElementById("categoriesLink")
            .addEventListener("click", function(event) {
                event.preventDefault();

                flowerPage.src = "categories.html";

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });

    </script>

</body>
</html>
